name: test-auth

on:
  pull_request:
    branches:
      - main
    paths: 
      - 'auth/**'


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup node js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: auth/package-lock.json
      - name: run test
        run: cd auth && npm ci  && npm run test:ci
