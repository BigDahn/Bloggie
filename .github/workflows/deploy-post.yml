name: deploy-post

on: 
  push:
    branches:
      - main
    paths:
      - 'posts/**'


jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: posts

    env:
      DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
      DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup node js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: posts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run code quality checks
        run:  npm run lint
      - name: Run typecheck
        run: npm run typecheck
      - name: Run dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - name: Build docker image and push
        run: | 
          docker build -t bigdahn/blog-post:${{ github.sha }} -t bigdahn/blog-post:latest .
          docker push bigdahn/blog-post:${{github.sha}}
          docker push bigdahn/blog-post:latest
    
