<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your verification code</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f7;
      font-family: Helvetica, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f4f7; padding: 32px 0"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
            "
          >
            <tr>
              <td style="background-color: #1a1a2e; padding: 24px 32px">
                <span style="color: #ffffff; font-size: 20px; font-weight: bold"
                  >Bloggie</span
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">
                <p
                  style="
                    margin: 0 0 16px 0;
                    color: #1a1a2e;
                    font-size: 16px;
                    line-height: 1.5;
                  "
                >
                  Hi there 👋,
                </p>
                <p
                  style="
                    margin: 0 0 24px 0;
                    color: #1a1a2e;
                    font-size: 16px;
                    line-height: 1.5;
                  "
                >
                  Use the code below to verify your account. This code expires
                  in {{expiryMinutes}} minutes.
                </p>
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                >
                  <tr>
                    <td align="center" style="padding: 16px 0">
                      <span
                        style="
                          display: inline-block;
                          padding: 16px 32px;
                          background-color: #f4f4f7;
                          border-radius: 6px;
                          font-size: 32px;
                          font-weight: bold;
                          letter-spacing: 8px;
                          color: #1a1a2e;
                        "
                      >
                        {{otp}}
                      </span>
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 24px 0 0 0;
                    color: #6b6b76;
                    font-size: 14px;
                    line-height: 1.5;
                  "
                >
                  If you didn't request this code, you can safely ignore this
                  email.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 32px; background-color: #f4f4f7">
                <p
                  style="
                    margin: 0;
                    color: #9a9aa5;
                    font-size: 12px;
                    line-height: 1.5;
                  "
                >
                  &copy; {{year}} Bloggie. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
